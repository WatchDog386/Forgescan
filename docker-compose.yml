# Starts the database and the backend:  docker compose up --build
# Zeek and Suricata are added to this file when the laboratory is built (see lab/README.md).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ainidr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ainidr
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ainidr"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENV: ${ENV:-development}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      DATABASE_URL: postgresql+psycopg://ainidr:${POSTGRES_PASSWORD}@db:5432/ainidr
      MODEL_DIR: /srv/models
      MONITORED_NETWORK: ${MONITORED_NETWORK:-192.168.56.0/24}
      FIREWALL_MODE: ${FIREWALL_MODE:-dry_run}
      FIREWALL_HOSTS: ${FIREWALL_HOSTS:-}
      FIREWALL_SSH_KEY: ${FIREWALL_SSH_KEY:-}
    volumes:
      - ./models:/srv/models
    ports:
      - "8000:8000"

volumes:
  dbdata:
